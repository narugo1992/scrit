#file: noinspection YAMLSchemaValidation
name: Newest

# Cadence
# - A run polls skeb.jp for new posts every 10 minutes for up to 330 minutes, then dispatches the next run
#   itself (the chain step below), so the crawler is effectively always running. GITHUB_TOKEN dispatches are not
#   subject to the schedule delays GitHub has had since 2026-08-27.
# - The cron entry is only a watchdog: it starts a run when the chain is broken. It does nothing while a run is
#   active, which keeps the run list free of cancelled queue entries.
# - Posts stay listed for about 3.5 days, so even a long outage is recovered from the cursor in the dataset.

on:
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: 'Minutes to keep polling before the run ends cleanly'
        default: '330'
      bootstrap:
        description: 'Posts to take when the repository has no cursor yet'
        default: '400'
      once:
        description: 'Run a single poll and exit'
        type: boolean
        default: false
      chain:
        description: 'Dispatch the next run when this one ends'
        type: boolean
        default: true
  schedule:
    - cron: '23 */3 * * *'

permissions:
  actions: write
  contents: read

jobs:
  guard:
    name: Is a run active
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          others=$(gh run list -R "${{ github.repository }}" --workflow newest.yml --limit 30 \
            --json databaseId,status \
            --jq '[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting")] | length')
          echo "other active newest runs: $others"
          if [ "$others" -gt 0 ]; then echo "active=true" >> "$GITHUB_OUTPUT"; else echo "active=false" >> "$GITHUB_OUTPUT"; fi

  newest:
    name: Newest posts
    needs: guard
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.guard.outputs.active == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # one crawler at a time; a dispatched run waits here instead of cancelling the one in flight
    concurrency:
      group: newest
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-newest.txt
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-newest.txt
      - name: Crawl
        id: crawl
        env:
          CI: 'true'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ENDPOINT: ${{ secrets.HF_ENDPOINT }}
          REMOTE_REPOSITORY: ${{ secrets.REMOTE_REPOSITORY }}
          BUDGET: ${{ github.event.inputs.budget_minutes || '330' }}
          BOOTSTRAP: ${{ github.event.inputs.bootstrap || '400' }}
          ONCE: ${{ github.event.inputs.once == 'true' && '--once' || '' }}
        shell: bash
        continue-on-error: true
        run: |
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          python -m test.prepare newest --budget-minutes "$BUDGET" --bootstrap "$BOOTSTRAP" $ONCE
      - name: Dispatch the next run
        # chain unless the crawl died right after starting, which would only burn runner minutes
        if: ${{ !cancelled() && github.event.inputs.chain != 'false' && github.event.inputs.once != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ steps.crawl.outputs.started }}
          OUTCOME: ${{ steps.crawl.outcome }}
        shell: bash
        run: |
          elapsed=$(( $(date +%s) - ${STARTED:-$(date +%s)} ))
          if [ "$OUTCOME" = "failure" ] && [ "$elapsed" -lt 900 ]; then
            echo "::warning::the crawl failed after ${elapsed}s, not chaining; the watchdog will start the next run"
            exit 0
          fi
          gh workflow run newest.yml -R "${{ github.repository }}" \
            -f budget_minutes="${{ github.event.inputs.budget_minutes || '330' }}" \
            -f bootstrap="${{ github.event.inputs.bootstrap || '400' }}"
      - name: Report the crawl result
        if: ${{ steps.crawl.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::error::the crawl step failed, see its log"
          exit 1
