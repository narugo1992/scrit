#file: noinspection YAMLSchemaValidation
name: Newest
run-name: Newest${{ github.event.inputs.once == 'true' && ' (once)' || '' }}${{ github.event.inputs.chain == 'false' && ' (no chain)' || '' }}

# Cadence
# - A run polls skeb.jp for new posts every 10 minutes for up to 330 minutes, then dispatches the next run itself
#   (the chain step below), so the crawler is effectively always running. GITHUB_TOKEN dispatches are not subject
#   to the schedule delays GitHub has had since 2026-08-27, which is why no cron entry is used.
# - If a run ends without dispatching its successor (the runner was lost), newest_resume.yml notices the run
#   finishing and starts a new one. Cancelling a run is the way to stop the crawler: neither the chain step nor
#   the resume workflow act on a cancelled run.
# - Only one crawler runs at a time: the concurrency group queues a dispatched run until the previous one has
#   ended, and the crawler also holds a lease in the dataset (state/lease.json).
# - Posts stay listed for about 3.5 days, so even a long outage is recovered from the cursor in the dataset.

on:
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: 'Minutes to keep polling before the run ends cleanly'
        default: '330'
      bootstrap:
        description: 'Posts to take when the repository has no cursor yet'
        default: '400'
      once:
        description: 'Run a single poll and exit (no chain, no resume)'
        type: boolean
        default: false
      chain:
        description: 'Dispatch the next run when this one ends (off: no resume either)'
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  newest:
    name: Newest posts
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # one crawler at a time; a dispatched run waits here instead of cancelling the one in flight
    concurrency:
      group: newest
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-newest.txt
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-newest.txt
      - name: Crawl
        id: crawl
        env:
          CI: 'true'
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ENDPOINT: ${{ secrets.HF_ENDPOINT }}
          REMOTE_REPOSITORY: ${{ secrets.REMOTE_REPOSITORY }}
          BUDGET: ${{ github.event.inputs.budget_minutes || '330' }}
          BOOTSTRAP: ${{ github.event.inputs.bootstrap || '400' }}
          ONCE: ${{ github.event.inputs.once == 'true' && '--once' || '' }}
        shell: bash
        continue-on-error: true
        run: |
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          set +e
          python -m test.prepare newest --budget-minutes "$BUDGET" --bootstrap "$BOOTSTRAP" $ONCE
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Dispatch the next run
        # exit code 4 means another crawler holds the lease: that one is alive, so there is nothing to continue
        # chain unless the crawl died right after starting, which would only burn runner minutes
        if: ${{ !cancelled() && github.event.inputs.chain != 'false' && github.event.inputs.once != 'true' && steps.crawl.outputs.code != '4' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ steps.crawl.outputs.started }}
          OUTCOME: ${{ steps.crawl.outcome }}
        shell: bash
        run: |
          elapsed=$(( $(date +%s) - ${STARTED:-$(date +%s)} ))
          if [ "$OUTCOME" = "failure" ] && [ "$elapsed" -lt 900 ]; then
            echo "::warning::the crawl failed after ${elapsed}s, not chaining"
            exit 0
          fi
          gh workflow run newest.yml -R "${{ github.repository }}" \
            -f budget_minutes="${{ github.event.inputs.budget_minutes || '330' }}" \
            -f bootstrap="${{ github.event.inputs.bootstrap || '400' }}"
      - name: Report the crawl result
        if: ${{ steps.crawl.outcome == 'failure' && steps.crawl.outputs.code != '4' }}
        shell: bash
        run: |
          echo "::error::the crawl step failed, see its log"
          exit 1
