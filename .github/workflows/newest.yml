#file: noinspection YAMLSchemaValidation
name: Newest

on:
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: 'Minutes to keep polling before the run ends cleanly'
        default: '330'
      bootstrap:
        description: 'Posts to take when the repository has no cursor yet'
        default: '400'
      once:
        description: 'Run a single poll and exit'
        type: boolean
        default: false
      chain:
        description: 'Dispatch the next run when this one ends'
        type: boolean
        default: true
  # the hourly watchdog is switched on once the new flow is verified:
  #  schedule:
  #    - cron: '17 * * * *'

# one crawler at a time; a queued run waits instead of cancelling the one in flight
concurrency:
  group: newest
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  newest:
    name: Newest posts
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-newest.txt
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-newest.txt
      - name: Crawl
        id: crawl
        env:
          CI: 'true'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ENDPOINT: ${{ secrets.HF_ENDPOINT }}
          REMOTE_REPOSITORY: ${{ secrets.REMOTE_REPOSITORY }}
          BUDGET: ${{ github.event.inputs.budget_minutes || '330' }}
          BOOTSTRAP: ${{ github.event.inputs.bootstrap || '400' }}
          ONCE: ${{ github.event.inputs.once == 'true' && '--once' || '' }}
        shell: bash
        continue-on-error: true
        run: |
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          python -m test.prepare newest --budget-minutes "$BUDGET" --bootstrap "$BOOTSTRAP" $ONCE
      - name: Dispatch the next run
        # chain unless the crawl died right after starting, which would only burn runner minutes
        if: ${{ always() && github.event.inputs.chain != 'false' && github.event.inputs.once != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ steps.crawl.outputs.started }}
          OUTCOME: ${{ steps.crawl.outcome }}
        shell: bash
        run: |
          elapsed=$(( $(date +%s) - ${STARTED:-$(date +%s)} ))
          if [ "$OUTCOME" = "failure" ] && [ "$elapsed" -lt 900 ]; then
            echo "::warning::the crawl failed after ${elapsed}s, not chaining; the watchdog will start the next run"
            exit 0
          fi
          gh workflow run newest.yml -R "${{ github.repository }}" \
            -f budget_minutes="${{ github.event.inputs.budget_minutes || '330' }}" \
            -f bootstrap="${{ github.event.inputs.bootstrap || '400' }}"
      - name: Report the crawl result
        if: ${{ steps.crawl.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::error::the crawl step failed, see its log"
          exit 1
