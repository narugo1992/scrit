#file: noinspection YAMLSchemaValidation
name: Newest resume

# Safety net for the self-chaining Newest workflow. It acts when a Newest run finishes (an event, so it does not
# suffer from GitHub's delayed schedules) and, as a third layer, on a cron entry that may fire late or not at all.
# Normally a finished run has dispatched its successor already and this does nothing.
#
# What it decides, from facts that hold whatever way the run ended (GitHub reports a job that hit the 6 hour limit
# as failed or cancelled depending on the day, so the conclusion alone is not trusted):
# - another Newest run is active or queued: nothing to do
# - the last run was cancelled before it could have used its budget: somebody stopped it on purpose, stay stopped
# - the last run was a debugging run: nothing to do
# - the last run failed within 15 minutes: wait 20 minutes, then start again (never a tight crash loop, never
#   given up either)
# - anything else (success, an error after a long run, killed at the time limit, lost runner): start a run

on:
  workflow_run:
    workflows: [Newest]
    types: [completed]
  schedule:
    - cron: '37 */3 * * *'

permissions:
  actions: write
  contents: read

jobs:
  resume:
    name: Start a run if none is going
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resume
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # set when a Newest run triggered this; absent for the cron. The run list lags behind GitHub's events and
          # can still show that run as going, so its own facts come from the event, and it is left out of the count.
          FINISHED: ${{ github.event.workflow_run.id }}
          F_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          F_TITLE: ${{ github.event.workflow_run.display_title }}
          F_STARTED: ${{ github.event.workflow_run.run_started_at }}
          F_UPDATED: ${{ github.event.workflow_run.updated_at }}
        shell: bash
        run: |
          snapshot() {
            gh run list -R "$REPO" --workflow newest.yml --limit 15 \
              --json databaseId,status,conclusion,displayTitle,startedAt,updatedAt
          }
          active() {
            jq --arg me "${FINISHED:-0}" '[.[] | select((.databaseId | tostring) != $me)
              | select(.status | IN("in_progress", "queued", "pending", "waiting", "requested"))] | length' <<<"$1"
          }

          # let the run list catch up with the event
          if [ -n "${FINISHED:-}" ]; then sleep 30; fi
          runs=$(snapshot)
          if [ "$(active "$runs")" -gt 0 ]; then
            echo "a newest run is already going or queued, nothing to do"
            exit 0
          fi

          if [ -n "${FINISHED:-}" ]; then
            id=$FINISHED; title=$F_TITLE; conclusion=$F_CONCLUSION; started=$F_STARTED; updated=$F_UPDATED
          else
            # the status filter of the runs API returns months old runs while GitHub is degraded, so the newest
            # finished run is picked from the unfiltered list here
            last=$(jq '[.[] | select(.status == "completed")] | max_by(.databaseId) // empty' <<<"$runs")
            if [ -n "$last" ]; then
              id=$(jq -r .databaseId <<<"$last"); title=$(jq -r .displayTitle <<<"$last")
              conclusion=$(jq -r .conclusion <<<"$last"); started=$(jq -r .startedAt <<<"$last"); updated=$(jq -r .updatedAt <<<"$last")
            fi
          fi

          if [ -n "${id:-}" ]; then
            lasted=$(( $(date -d "$updated" +%s) - $(date -d "$started" +%s) ))
            echo "last run: $id '$title' $conclusion after ${lasted}s"
            case "$title" in
              *"(once)"*|*"(no chain)"*) echo "a debugging run, nothing to do"; exit 0 ;;
            esac
            if [ "$conclusion" = "cancelled" ] && [ "$lasted" -lt 19800 ]; then
              echo "cancelled before its budget was used: stopped on purpose, staying stopped"
              exit 0
            fi
            if [ "$conclusion" != "success" ] && [ "$lasted" -lt 900 ]; then
              echo "::warning::the last run ended with '$conclusion' after ${lasted}s, starting again in 20 minutes"
              sleep 1200
              if [ "$(active "$(snapshot)")" -gt 0 ]; then echo "a run appeared meanwhile"; exit 0; fi
            fi
          fi

          for attempt in 1 2 3 4 5; do
            if gh workflow run newest.yml -R "$REPO"; then
              echo "::notice::no newest run was active, started one"
              exit 0
            fi
            sleep $(( attempt * 20 ))
          done
          echo "::error::could not start a newest run"
          exit 1
